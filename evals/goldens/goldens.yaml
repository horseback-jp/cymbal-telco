conversations:
  - conversation: golden_full_converged_journey
    session_parameters:
      customer_id: "CUST-GEOFF-001"
      billing_refund_status: "pending"
      journey_stage: "discovery"
    turns:
      - user: "Hi, my broadband keeps dropping out in our kitchen-diner, my teenagers are lagging terribly on their Xbox consoles upstairs, and I'm pretty sure I've been overcharged by twelve pounds on my latest bill."
        agent: "[prosody rate=\"66%\"] Right, let me check your account and line health for you now, Geoff... [short pause] [slow] I can see a duplicate twelve-pound Cyber Security charge on invoice INV-8841 and I have already refunded that twelve pounds straight back to your Visa ending 4412, while your live telemetry shows your street exchange is green but your single Smart Hub 2 logged four packet drops in the last twenty-four hours across fourteen connected devices with weak signal reaching the kitchen-diner and upstairs bedrooms. Let's not just patch it — would you like to see the tailored all-in-one home bundle I've put together to upgrade your speeds, blanket every room in guaranteed Wi-Fi, and include Xbox gaming for the kids?"
        tool_calls:
          - action: resolve_billing_and_diagnostics
            args:
              customer_id: "CUST-GEOFF-001"
          - action: update_storefront_ui
            args:
              view: "account_diagnostics"
              payload_json:
                $matchType: "ignore"
                $matchValue: ""
                $originalValue: ""
      - user: "Yes please, show me what you've put together to fix the house properly."
        agent: "[prosody rate=\"68%\"] Certainly, let me bring up your tailored bundle options now... [short pause] [neutral] Because your family games and streams heavily, I've built the Cymbal One Converged Home Bundle combining three upgrades: Full Fibre 900 for ultra-stable symmetrical speeds, our Complete Wi-Fi Guarantee with three Smart Wi-Fi 6E Mesh Discs and Hybrid 4G Backup, plus Cymbal TV Sport and Xbox Game Pass Ultimate for the kids. Instead of ninety pounds a month separately, you get all three together for our converged rate of sixty-eight pounds a month — saving you twenty-two pounds every month. Would you like to see on your screen how the three discs cover your kitchen and upstairs bedrooms, or shall we add the bundle straight to your basket?"
        tool_calls:
          - action: build_tailored_home_bundle
            args:
              customer_id: "CUST-GEOFF-001"
              view_type: "carousel"
          - action: show_product_carousel
            args:
              productDetails:
                $matchType: "ignore"
                $matchValue: ""
                $originalValue: ""
          - action: update_storefront_ui
            args:
              view: "tailored_bundle_showcase"
              payload_json:
                $matchType: "ignore"
                $matchValue: ""
                $originalValue: ""
      - user: "Show me the coverage map first — how will those three discs actually reach our kitchen extension and the kids' bedrooms upstairs?"
        agent: "[prosody rate=\"68%\"] Let me bring up your home Wi-Fi mesh coverage map on screen now... [short pause] [positive] By placing the new Smart Hub 3 and Disc 1 in your front hallway, Disc 2 in the rear kitchen-diner extension, and Disc 3 on the upstairs landing, you get a single seamless Wi-Fi 6E mesh network that completely eliminates those weak signal zones and gives the kids' Xbox consoles a rock-solid connection backed by automatic Hybrid 4G failover. Shall we go ahead and upgrade your home with this bundle today?"
        tool_calls:
          - action: update_storefront_ui
            args:
              view: "mesh_coverage_map"
              view_mode: "after_mesh_coverage"
              payload_json:
                $matchType: "ignore"
                $matchValue: ""
                $originalValue: ""
      - user: "Yes, that looks spot on. Let's go ahead and add the bundle to my basket."
        agent: "[prosody rate=\"74%\"] Brilliant, let me pop that bundle into your basket and pre-book your priority engineer slot now... [short pause] [positive] Your entire Cymbal One Converged Home Bundle — Full Fibre 900, three Smart Wi-Fi Discs with 4G Backup, and Cymbal TV Sport with Xbox Game Pass Ultimate — is ready in your checkout basket at sixty-eight pounds a month with your twelve-pound refund credit applied and free installation. I've also pre-scheduled a priority engineer under ServiceNow ticket INC-904821 for Thursday between ten a.m. and twelve p.m. with your router telemetry and three-disc house map already attached — is there anything else I can help you with today?"
        tool_calls:
          - action: complete_converged_checkout
            args:
              customer_id: "CUST-GEOFF-001"
              confirm_upgrade: "true"
          - action: update_storefront_ui
            args:
              view: "checkout_and_servicenow"
              payload_json:
                $matchType: "ignore"
                $matchValue: ""
                $originalValue: ""
      - user: "No, that's everything sorted. Thanks very much, goodbye."
        agent: "[prosody rate=\"74%\"] [positive] Thank you so much for choosing Cymbal Telecom, Geoff... [short pause] I hope you and the family enjoy the new speeds and have a lovely rest of your day."
        tool_calls:
          - action: end_session
    expectations:
      - "In Turn 1, the agent must call resolve_billing_and_diagnostics and update_storefront_ui with view 'account_diagnostics', confirm the £12.00 duplicate charge refund on invoice INV-8841 to Visa ending 4412, and share the Smart Hub 2 telemetry diagnosis (4 packet drops in 24 hours across 14 devices)."
      - "In Turn 2, the agent must call build_tailored_home_bundle, show_product_carousel, and update_storefront_ui with view 'tailored_bundle_showcase', and pitch the Cymbal One Converged Home Bundle at £68/month saving £22/month compared to £90/month standalone."
      - "In Turn 3, the agent must call update_storefront_ui with view 'mesh_coverage_map' and explain how placing the three discs in the hallway, rear kitchen-diner, and upstairs landing eliminates dead zones with Hybrid 4G backup."
      - "In Turn 4, the agent must call complete_converged_checkout and update_storefront_ui with view 'checkout_and_servicenow', confirming the £68/month bundle with the £12 refund credit applied and ServiceNow ticket INC-904821 for Thursday between 10:00 AM and 12:00 PM."
      - "In Turn 5, the agent must deliver a warm British farewell and call end_session."
    tags: [P0, NO-GO, happy-path, four-step-journey, PRD-4.1, PRD-4.2, PRD-4.3, PRD-4.4]

