evals:
  - name: sim_frustrated_to_converged_upgrade
    tags: [P0, HIGH, sim, consultative-selling, objection-handling, PRD-1, PRD-4]
    session_parameters:
      customer_id: "CUST-GEOFF-001"
    steps:
      - goal: "Start as a frustrated customer reporting broadband dropouts in the rear kitchen-diner, teenage kids lagging on their Xbox consoles upstairs, and a £12 duplicate charge on the latest bill; express skepticism about paying £68/month instead of the current £44/month out-of-contract Fibre 100 tariff and ask for a side-by-side price comparison; ask how the 3 Smart Wi-Fi Mesh Discs will cover the 4-bedroom home; and once the £22/month bundle savings (versus £90/month standalone) and 3-disc coverage map are explained, accept the Cymbal One Converged Home Bundle upgrade and Thursday morning priority engineer installation."
        success_criteria: "The agent proactively resolves and auto-refunds the £12.00 duplicate Cymbal Cyber Security charge on Invoice INV-8841 to Visa ending 4412, shares the live Smart Hub 2 telemetry (4 packet drops in 24 hours across 14 connected devices and 850 GB/month usage, weak Wi-Fi signal in the kitchen-diner and upstairs back bedrooms, and a green Manchester South exchange), addresses Geoff's price objection by comparing his £44.00/month out-of-contract Fibre 100 plan against the £90.00/month standalone upgrade total (£55 Full Fibre 900 + £20 Complete Wi-Fi 3 Smart Discs & 4G Backup + £15 Cymbal TV Sport & Xbox Game Pass Ultimate) to justify the £68.00/month Cymbal One Converged Home Bundle (saving £22.00/month), displays and explains the 3-disc home Wi-Fi mesh coverage map (Hallway, Rear Kitchen-Diner, Upstairs Landing), and completes the 1-click checkout with the -£12.00 refund credit and pre-provisioned ServiceNow engineer appointment INC-904821 for Thursday 10:00 AM–12:00 PM. Having the Cymbal One Converged Home Bundle added to the checkout basket at £68.00/month and ServiceNow priority engineer ticket INC-904821 confirmed for Thursday 10:00 AM–12:00 PM counts as a successful outcome."
        response_guide: "You are Geoff Horsfield (customer_id CUST-GEOFF-001), living in a 4-bedroom house at 14 Oakwood Avenue, Manchester, M20 2WQ with a rear kitchen-diner extension, a Smart Hub 2 by the front door in the hallway, and teenage kids gaming on Xbox consoles in the upstairs back bedrooms. Follow this progression across the conversation: (1) Start with frustration by saying: 'My broadband has been cutting out in the kitchen-diner all morning, my teenage kids are lagging badly on their Xbox consoles upstairs, and I've just spotted a £12 duplicate charge on my latest bill.' (2) After the agent confirms your £12.00 refund to Visa 4412, shares your Smart Hub 2 telemetry diagnosis, and offers to show a tailored home bundle, express price skepticism by saying: 'I appreciate you sorting the £12 refund, but I'm currently paying £44 a month on Fibre 100. What's actually in this bundle, and why should I pay more—can you show me how the prices compare side-by-side?' (3) Once the agent presents the 3-pillar Cymbal One Converged Home Bundle at £68/month (saving £22/month vs £90/month standalone) and shows the comparison, ask: 'Right, £68 instead of £90 separately makes sense with the Xbox Game Pass included, but how will those three Smart Wi-Fi Discs actually fix the dead zones in my four-bedroom house with the kitchen-diner extension out the back and the bedrooms upstairs?' (4) After the agent updates the screen with the mesh coverage map and explains placing Disc 1 in the hallway, Disc 2 in the kitchen-diner, and Disc 3 on the upstairs landing with Hybrid 4G backup, accept the upgrade by saying: 'That looks spot on—yes, let's go ahead and add the Cymbal One bundle to my basket and book the engineer for Thursday morning.'"
        max_turns: 12
    expectations:
      - "The agent must call a tool to resolve the billing discrepancy and run live network telemetry diagnostics, and call a client UI tool to update the web storefront to the account diagnostics view."
      - "In its first response, the agent must confirm that the £12.00 duplicate Cymbal Cyber Security charge on Invoice INV-8841 has already been refunded to Geoff's Visa card ending 4412, and share the Smart Hub 2 telemetry findings (4 packet drops in 24 hours across 14 connected devices and 850 GB/month usage, weak Wi-Fi signal in the kitchen-diner and upstairs bedrooms, and a green local exchange)."
      - "The agent must call a tool to build the tailored 3-pillar home bundle, call a rich widget tool to display the bundle cards or side-by-side price comparison in chat, and call a client UI tool to update the web storefront to the tailored bundle showcase."
      - "The agent must address Geoff's price objection by clearly explaining the value of the Cymbal One Converged Home Bundle at £68.00/month compared to £90.00/month if bought standalone (saving £22.00/month across Cymbal Full Fibre 900 at £55, Complete Wi-Fi Guarantee with 3 Smart Discs and 4G Backup at £20, and Cymbal TV Sport & Xbox Game Pass Ultimate at £15) versus his out-of-contract Fibre 100 plan at £44.00/month."
      - "When Geoff asks how the mesh discs will cover his 4-bedroom house, the agent must call a client UI tool to update the web storefront to the mesh coverage map view and explain placing Disc 1 in the front hallway, Disc 2 in the rear kitchen-diner extension, and Disc 3 on the upstairs landing backed by automatic Hybrid 4G failover."
      - "When Geoff agrees to upgrade, the agent must call a tool to complete the converged checkout and pre-provision the ServiceNow handover record, and call a client UI tool to update the web storefront to the checkout and ServiceNow confirmation view."
      - "The agent must confirm that all three bundle pillars are in the basket at £68.00/month with the £12.00 refund credit applied and free installation, and confirm ServiceNow ticket INC-904821 for a priority engineer on Thursday between 10:00 AM and 12:00 PM."
      - "The agent must maintain Cymbal Telecom UK branding throughout and never reference BT, EE, or Openreach, nor transfer the customer to another agent."

  - name: sim_mesh_coverage_and_gaming_qa
    tags: [P1, MEDIUM, sim, mesh-coverage, gaming-qa, PRD-4.3, PRD-4.4]
    session_parameters:
      customer_id: "CUST-GEOFF-001"
    steps:
      - goal: "Report Wi-Fi dropouts in the rear kitchen-diner extension and Xbox gaming lag in the upstairs back bedrooms along with the £12 billing overcharge; view the £68/month Cymbal One Converged Home Bundle recommendation; ask detailed technical questions about where each of the 3 Smart Wi-Fi 6E Mesh Discs will be placed in the 4-bedroom home and how the Hybrid 4G Backup protects the kids' Xbox gaming sessions if the fibre line blips; and then confirm the 1-click checkout and Thursday morning priority engineer installation."
        success_criteria: "The agent auto-refunds the £12.00 Invoice INV-8841 duplicate charge to Visa 4412, reports the Smart Hub 2 telemetry (4 packet drops in 24h across 14 devices and 850 GB/month usage with -79 dBm to -82 dBm weak zones in the kitchen-diner and upstairs bedrooms), presents the £68.00/month 3-Pillar Cymbal One Converged Home Bundle (saving £22.00/month vs £90.00/month standalone), updates the web storefront to the mesh coverage map, explains the exact 3-disc placement plan (Smart Hub 3 and Disc 1 in the ground-floor hallway, Disc 2 in the rear kitchen-diner extension, and Disc 3 on the upstairs landing) plus automatic Hybrid 4G failover and 900 Mbps symmetrical speeds with Xbox Game Pass Ultimate, and completes the 1-click checkout with ServiceNow ticket INC-904821 scheduled for Thursday 10:00 AM–12:00 PM. Having the mesh placement and Hybrid 4G failover questions answered, the Cymbal One Converged Home Bundle added to the basket at £68.00/month, and ServiceNow engineer appointment INC-904821 confirmed counts as a successful outcome."
        response_guide: "You are Geoff Horsfield (customer_id CUST-GEOFF-001), living in a 4-bedroom house at 14 Oakwood Avenue, Manchester, M20 2WQ with a rear kitchen-diner extension, a Smart Hub 2 by the front door in the hallway, and teenage kids gaming on Xbox consoles in the upstairs back bedrooms. Follow this progression: (1) Open by saying: 'Hi, my Wi-Fi keeps dropping out in our rear kitchen-diner extension, my kids are getting awful lag on their Xbox consoles in the upstairs back bedrooms, and I also think I was charged twice for cyber security on Invoice INV-8841.' (2) When the agent confirms the £12.00 instant refund to your Visa ending 4412, shares your Smart Hub 2 telemetry, and offers to show a tailored home bundle, reply: 'Thanks for sorting the refund so quickly—yes, please show me what you've put together to fix the Wi-Fi and gaming.' (3) After the agent presents the £68/month Cymbal One Converged Home Bundle (Full Fibre 900, Complete Wi-Fi Guarantee with 3 Smart Discs and 4G Backup, and Cymbal TV Sport & Xbox Game Pass Ultimate), ask a detailed technical question: 'Could you bring up the coverage map on my screen and explain exactly where each of the three Smart Wi-Fi Discs would go in our four-bedroom house—given the hub is by the front door in the hallway, the kitchen-diner is out the back, and the kids' Xboxes are in the upstairs back bedrooms—and what happens if the fibre connection ever blips mid-game?' (4) Once the agent updates the screen to the mesh coverage map and explains the 3-disc placement (Hallway, Kitchen-Diner, Upstairs Landing) and automatic Hybrid 4G failover, say: 'Brilliant, that's exactly what we need—let's add the bundle to my basket and lock in the Thursday morning engineer visit.'"
        max_turns: 12
    expectations:
      - "The agent must call a tool to resolve the £12.00 duplicate charge on Invoice INV-8841 and retrieve the 24-hour network telemetry, and call a client UI tool to update the web storefront to the account diagnostics view."
      - "The agent must call a tool to construct the 3-pillar Cymbal One Converged Home Bundle, call a rich widget tool to render the bundle cards in chat, and call a client UI tool to update the web storefront to the tailored bundle showcase."
      - "When Geoff asks about the coverage map and disc placement for his 4-bedroom house, the agent must call a client UI tool to update the web storefront to the mesh coverage map view."
      - "The agent must clearly explain the 3-disc placement plan for Geoff's home: Smart Hub 3 and Disc 1 in the ground-floor hallway, Disc 2 in the rear kitchen-diner extension (eliminating the -79 dBm dead zone), and Disc 3 on the upstairs landing outside the back bedrooms (eliminating the -82 dBm dead zone for the kids' Xbox consoles)."
      - "The agent must explain how the Complete Wi-Fi Guarantee includes automatic Hybrid 4G Backup failover so the connection stays online if the fibre line ever drops, alongside 900 Mbps symmetrical Full Fibre speeds and Xbox Game Pass Ultimate."
      - "When Geoff confirms the upgrade, the agent must call a tool to complete the converged checkout and pre-provision the ServiceNow handover record, and call a client UI tool to update the web storefront to the checkout and ServiceNow confirmation view."
      - "The agent must confirm the £68.00/month Cymbal One Converged Home Bundle in the basket with the -£12.00 refund credit applied, free installation, and ServiceNow priority engineer ticket INC-904821 scheduled for Thursday between 10:00 AM and 12:00 PM."
